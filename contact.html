<html lang="ja">

        <meta charset="UTF-8">

    <!-- CSS -->
        <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
        <link href="https:/fonts.googleapis.com/css?family=philosopher" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@100;300;400;500;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">

    <body>
        <header class="page-header wrapper">
            <h1><a href="index.html"><img class="logo" src="images/logo.png" alt="sitelogo"></a></h1>
            <nav>
                <ul class="main-nav">
                    <li><a href="https://">Works</a></li>
                    <li><a href="https://">About</a></li>
                    <li><a href="https://">Contact</a></li>
                </ul>
            </nav>
        </header>

        <div class="menu-content wrapper">
            <div class="sub-title-image"><img src="images/Contact.png" alt="Contact"></div>

           <p class="sub-message">お仕事のご依頼・ご相談は、以下のフォームからお願いいたします。<br>
            お気軽にお問い合わせください。<br>
            <br>
            <span class="hissu">＊</span>のついた項目は必須事項です。</p>
            <form action="#">
            <div>
                <label for="name">お名前<span class="hissu">＊</span></label>
                <input type="text" id="name" name="your-name" placeholder="お名前をご入力ください。" required>
            </div>

            <div>
                <label for="companyname">御社名</label>
                <input type="text" id="conmanyname" name="your-conmanyname" placeholder="御社名をご入力ください。">
            </div>

            <div>
                <label for="email">メールアドレス<span class="hissu">＊</span></label>
                <input type="email" id="email" name="your-email" placeholder="メールアドレスをご入力ください。" required>
            </div>

            <div>
                <label for="message">お問い合わせ内容<span class="hissu">＊</span></label>
                <textarea id="message" name="your-message" placeholder="ご質問・ご要望などもございましたらご自由にご入力ください。" required></textarea>
            </div>
            <div class="button-container">
            <input type="submit" class="button" value="送&emsp;信">
            </div>
            </form>

        </div><!-- /.wrapper-->





        <footer>
            <div class="wrapper">
                <ul class="main-nav">
                    <li><a href="">Works</a></li>
                    <li><a href="">About</a></li>
                    <li><a href="">Contact</a></li>
                </ul>
                <p><small>&copy; 2025- kamei chiho</small></p>
            </div>
        </footer>
    </body>
